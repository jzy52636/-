<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融函数记忆挑战赛</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --term-back: #3498db;    /* 英文：蓝色 */
            --def-back: #e67e22;     /* 中文：橙色 */
            --card-front: #ffffff;
            --success-color: #27ae60;
            --penalty-color: #e74c3c;
            --bg-color: #f0f2f5;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 { color: var(--primary-color); margin-bottom: 5px; }
        .desc { color: #666; margin-bottom: 15px; font-size: 0.9rem; text-align: center; }

        /* 计分板样式 */
        .scoreboard {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 1.5rem; font-weight: bold; color: var(--primary-color); }
        .stat-label { font-size: 0.8rem; color: #888; text-transform: uppercase; }
        #score { color: var(--success-color); }

        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
            perspective: 1000px;
        }

        @media (max-width: 500px) {
            .game-container { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        }

        .card {
            aspect-ratio: 3 / 2;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            font-weight: bold;
            box-sizing: border-box;
        }

        /* 背面 */
        .card-back { color: white; font-size: 1.5rem; }
        .type-term .card-back { background-color: var(--term-back); }
        .type-def .card-back { background-color: var(--def-back); }

        /* 正面 */
        .card-front {
            background-color: var(--card-front);
            color: var(--primary-color);
            transform: rotateY(180deg);
            border: 2px solid #eee;
            font-size: 0.9rem;
        }

        .card.matched {
            visibility: hidden;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s ease;
        }

        /* 惩罚提示动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .penalty-shake { animation: shake 0.3s inset; }

        #reset-btn {
            margin-top: 30px;
            padding: 12px 40px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        #reset-btn:hover { transform: scale(1.05); background-color: #1a252f; }

        .win-message {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>金融函数记忆挑战</h1>
    <p class="desc">匹配成功 +100 | 错误扣分 -10 | 忘记看过的牌额外 -20</p>

    <div class="scoreboard">
        <div class="stat-item">
            <span class="stat-value" id="score">0</span>
            <span class="stat-label">当前得分</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="moves">0</span>
            <span class="stat-label">总步数</span>
        </div>
    </div>

    <div class="game-container" id="game-board"></div>

    <div class="win-message" id="win-msg">
        <h2 style="color: var(--success-color);">🎉 挑战完成！</h2>
        <p id="final-stats"></p>
    </div>

    <button id="reset-btn">重新开始</button>

    <script>
        const dataPairs = [
            { term: 'PMT', def: '计算等额分期偿还额' },
            { term: 'Rate', def: '各期利率' },
            { term: 'Nper', def: '还款期数' },
            { term: 'Pv', def: '贷款总额' },
            { term: 'Fv', def: '到期未还额' },
            { term: 'Type', def: '月初或月末还款' }
        ];

        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let score = 0;
        let seenCards = new Set(); // 用于记录玩家看过的牌的索引

        const gameBoard = document.getElementById('game-board');
        const movesDisplay = document.getElementById('moves');
        const scoreDisplay = document.getElementById('score');
        const winMsg = document.getElementById('win-msg');

        function initGame() {
            gameBoard.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            score = 0;
            seenCards.clear();
            
            movesDisplay.innerText = moves;
            scoreDisplay.innerText = score;
            scoreDisplay.style.color = 'var(--success-color)';
            winMsg.style.display = 'none';

            let gameData = [];
            dataPairs.forEach((pair, index) => {
                gameData.push({ text: pair.term, pairId: index, type: 'term' });
                gameData.push({ text: pair.def, pairId: index, type: 'def' });
            });

            // 随机洗牌
            gameData.sort(() => Math.random() - 0.5);

            gameData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `card ${item.type === 'term' ? 'type-term' : 'type-def'}`;
                card.dataset.pairId = item.pairId;
                card.dataset.index = index; // 唯一的索引标识

                card.innerHTML = `
                    <div class="card-face card-back">?</div>
                    <div class="card-face card-front">${item.text}</div>
                `;
                
                card.addEventListener('click', () => handleFlip(card));
                gameBoard.appendChild(card);
            });
        }

        function handleFlip(card) {
            if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesDisplay.innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.pairId === card2.dataset.pairId;

            if (isMatch) {
                // 配对成功
                score += 6;
                matchedCount++;
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    flippedCards = [];
                    updateUI();
                    if (matchedCount === dataPairs.length) {
                        showWin();
                    }
                }, 600);
            } else {
                // 配对失败
                let penalty = 1; // 基础扣分

                // 检查是否触发记忆惩罚：
                // 如果翻开的牌之前已经出现在“已看过”名单里，说明玩家忘记了位置
                if (seenCards.has(card1.dataset.index)) penalty += 2;
                if (seenCards.has(card2.dataset.index)) penalty += 2;

                score -= penalty;

                // 标记这两张牌为“已看过”
                seenCards.add(card1.dataset.index);
                seenCards.add(card2.dataset.index);

                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    updateUI();
                }, 1000);
            }
        }

        function updateUI() {
            scoreDisplay.innerText = score;
            // 如果分数为负，显示红色
            scoreDisplay.style.color = score < 0 ? 'var(--penalty-color)' : 'var(--success-color)';
        }

        function showWin() {
            winMsg.style.display = 'block';
            document.getElementById('final-stats').innerText = `最终得分：${score} | 总计步数：${moves}`;
        }

        document.getElementById('reset-btn').addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
