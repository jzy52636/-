<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融函数记忆挑战</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --term-back: #3498db;    /* 英文：蓝色 */
            --def-back: #e67e22;     /* 中文：橙色 */
            --card-front: #ffffff;
            --success-color: #27ae60;
            --penalty-color: #e74c3c;
            --bg-color: #f0f2f5;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 { color: var(--primary-color); margin-bottom: 5px; }
        .desc { color: #666; margin-bottom: 15px; font-size: 0.85rem; text-align: center; line-height: 1.5; }

        .scoreboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: white;
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .stat-item { text-align: center; min-width: 80px; }
        .stat-value { display: block; font-size: 1.4rem; font-weight: bold; color: var(--primary-color); }
        .stat-label { font-size: 0.75rem; color: #888; }
        #score { color: #2c3e50; }

        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 550px;
            width: 100%;
            perspective: 1000px;
        }

        @media (max-width: 500px) {
            .game-container { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            aspect-ratio: 3 / 2;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .card.flipped { transform: rotateY(180deg); }

        /* 同色禁止时的抖动效果 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            60% { transform: translateX(5px); }
        }
        .invalid-action { animation: shake 0.3s; }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            font-weight: bold;
            box-sizing: border-box;
        }

        .card-back { color: white; font-size: 1.4rem; }
        .type-term .card-back { background-color: var(--term-back); }
        .type-def .card-back { background-color: var(--def-back); }

        .card-front {
            background-color: var(--card-front);
            color: var(--primary-color);
            transform: rotateY(180deg);
            border: 2px solid #eee;
            font-size: 0.85rem;
        }

        .card.matched {
            visibility: hidden;
            opacity: 0;
            transform: scale(0);
            transition: all 0.4s ease;
        }

        #reset-btn {
            margin-top: 25px;
            padding: 10px 35px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .win-message {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>金融函数记忆挑战</h1>
    <div class="desc">
        规则：初始20分 | 匹配错误 -0.5 | 忘掉看过的牌额外扣分<br>
        <strong>注意：禁止连续翻开两张相同颜色的牌！</strong>
    </div>

    <div class="scoreboard">
        <div class="stat-item">
            <span class="stat-value" id="score">20.0</span>
            <span class="stat-label">剩余分数</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="moves">0</span>
            <span class="stat-label">步数</span>
        </div>
    </div>

    <div class="game-container" id="game-board"></div>

    <div class="win-message" id="win-msg">
        <h2 style="color: var(--success-color);">匹配完成！</h2>
        <p id="final-stats"></p>
    </div>

    <button id="reset-btn">重新开始</button>

    <script>
        const dataPairs = [
            { term: 'PMT', def: '计算等额分期偿还额' },
            { term: 'Rate', def: '各期利率' },
            { term: 'Nper', def: '还款期数' },
            { term: 'Pv', def: '贷款总额' },
            { term: 'Fv', def: '到期未还额' },
            { term: 'Type', def: '月初或月末还款' }
        ];

        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let score = 20.0;
        let flipHistory = {}; // 记录每张牌翻开的次数

        const gameBoard = document.getElementById('game-board');
        const movesDisplay = document.getElementById('moves');
        const scoreDisplay = document.getElementById('score');
        const winMsg = document.getElementById('win-msg');

        function initGame() {
            gameBoard.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            score = 20.0;
            flipHistory = {};
            
            movesDisplay.innerText = moves;
            updateScoreUI();
            winMsg.style.display = 'none';

            let gameData = [];
            dataPairs.forEach((pair, index) => {
                gameData.push({ text: pair.term, pairId: index, type: 'term' });
                gameData.push({ text: pair.def, pairId: index, type: 'def' });
            });

            gameData.sort(() => Math.random() - 0.5);

            gameData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `card ${item.type === 'term' ? 'type-term' : 'type-def'}`;
                card.dataset.pairId = item.pairId;
                card.dataset.type = item.type;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-face card-back">?</div>
                    <div class="card-face card-front">${item.text}</div>
                `;
                
                card.addEventListener('click', () => handleFlip(card));
                gameBoard.appendChild(card);
            });
        }

        function handleFlip(card) {
            if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }

            // 规则：禁止翻开颜色相同的牌
            if (flippedCards.length === 1) {
                const firstCard = flippedCards[0];
                if (firstCard.dataset.type === card.dataset.type) {
                    // 触发抖动提示
                    card.classList.add('invalid-action');
                    setTimeout(() => card.classList.remove('invalid-action'), 300);
                    return; 
                }
            }

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesDisplay.innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.pairId === card2.dataset.pairId;

            if (isMatch) {
                matchedCount++;
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    flippedCards = [];
                    if (matchedCount === dataPairs.length) showWin();
                }, 600);
            } else {
                // 扣分逻辑
                const n1 = flipHistory[card1.dataset.index] || 0;
                const n2 = flipHistory[card2.dataset.index] || 0;
                
                // 基础0.5 + 忘记惩罚 (0.5 * 次数)
                const penalty = 0.5 + (n1 * 0.5) + (n2 * 0.5);
                score -= penalty;

                // 更新翻开历史
                flipHistory[card1.dataset.index] = n1 + 1;
                flipHistory[card2.dataset.index] = n2 + 1;

                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    updateScoreUI();
                }, 1000);
            }
        }

        function updateScoreUI() {
            scoreDisplay.innerText = score.toFixed(1);
            scoreDisplay.style.color = score < 10 ? 'var(--penalty-color)' : 'var(--primary-color)';
        }

        function showWin() {
            winMsg.style.display = 'block';
            document.getElementById('final-stats').innerText = `最终得分：${score.toFixed(1)} | 步数：${moves}`;
        }

        document.getElementById('reset-btn').addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
