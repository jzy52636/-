<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融函数记忆翻牌 - 颜色区分版</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --term-color: #3498db;       /* 函数名的颜色：蓝色 */
            --def-color: #e67e22;        /* 释义的颜色：橙色 */
            --success-color: #27ae60;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 { color: var(--primary-color); margin-bottom: 10px; }
        .stats { margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; }

        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 800px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .game-container { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            aspect-ratio: 3 / 2;
            background-color: #95a5a6; /* 未翻开时的背面颜色：灰色 */
            color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.3s, background-color 0.3s;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        /* 问号样式 */
        .card::before {
            content: "?";
            color: white;
            font-size: 1.5rem;
            position: absolute;
        }

        /* 翻开后的样式 */
        .card.flipped::before { display: none; }
        .card.flipped { color: white; transform: rotateY(180deg); }

        /* --- 颜色区分关键代码 --- */
        /* 函数名卡片翻开后的颜色 */
        .card.flipped.type-term {
            background-color: var(--term-color) !important;
        }
        /* 释义卡片翻开后的颜色 */
        .card.flipped.type-def {
            background-color: var(--def-color) !important;
        }

        .card.matched {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s;
        }

        #reset-btn {
            margin-top: 30px;
            padding: 10px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .win-message {
            display: none;
            margin-top: 20px;
            color: var(--success-color);
            font-weight: bold;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>金融函数记忆翻牌</h1>
    <div class="stats">尝试次数: <span id="moves">0</span></div>

    <div class="game-container" id="game-board"></div>
    <div class="win-message" id="win-msg">恭喜！全部匹配成功！🎉</div>
    <button id="reset-btn">重新开始</button>

    <script>
        const dataPairs = [
            { term: 'PMT', def: '计算等额分期偿还额' },
            { term: 'Rate', def: '各期利率' },
            { term: 'Nper', def: '还款期数' },
            { term: 'Pv', def: '贷款总额' },
            { term: 'Fv', def: '到期未还额' },
            { term: 'Type', def: '月初或月末还款' }
        ];

        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        const gameBoard = document.getElementById('game-board');
        const movesDisplay = document.getElementById('moves');
        const winMsg = document.getElementById('win-msg');

        function initGame() {
            gameBoard.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            movesDisplay.innerText = moves;
            winMsg.style.display = 'none';

            let gameData = [];
            dataPairs.forEach((pair, index) => {
                // 标记类型：term 代表函数名，def 代表释义
                gameData.push({ text: pair.term, pairId: index, type: 'term' });
                gameData.push({ text: pair.def, pairId: index, type: 'def' });
            });

            gameData.sort(() => Math.random() - 0.5);

            gameData.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.classList.add(item.type === 'term' ? 'type-term' : 'type-def');
                card.dataset.pairId = item.pairId;
                card.innerText = item.text;
                
                card.addEventListener('click', () => flipCard(card));
                gameBoard.appendChild(card);
            });
        }

        function flipCard(card) {
            if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesDisplay.innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.pairId === card2.dataset.pairId;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedCount++;
                    flippedCards = [];
                    if (matchedCount === dataPairs.length) {
                        winMsg.style.display = 'block';
                    }
                }, 600);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 1000);
            }
        }

        document.getElementById('reset-btn').addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
